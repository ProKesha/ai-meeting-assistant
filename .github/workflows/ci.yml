name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ai_meeting_assistant_test
      TRANSCRIPTION_PROVIDER: local
      LOCAL_WHISPER_MODEL: small
      LOCAL_WHISPER_DEVICE: cpu
      LOCAL_WHISPER_COMPUTE_TYPE: int8
      LOCAL_EMBEDDING_MODEL: intfloat/multilingual-e5-small
      LOCAL_EMBEDDING_DEVICE: cpu
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_ANALYSIS_MODEL: llama3.2:3b
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-bookworm
        env:
          POSTGRES_DB: ai_meeting_assistant_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_meeting_assistant_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify dependencies and compile Python
        run: |
          python -m pip check
          python -m compileall -q app tests alembic

      - name: Apply and validate database migrations
        run: |
          alembic upgrade head
          alembic check

      - name: Run backend tests
        run: pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Type-check frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      POSTGRES_DB: ai_meeting_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: compose-ci-only

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build backend image
        run: docker build --tag ai-meeting-assistant-backend:ci .

      - name: Build frontend image
        run: >-
          docker build
          --build-arg NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
          --tag ai-meeting-assistant-frontend:ci
          ./frontend
