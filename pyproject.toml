[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-meeting-task-assistant"
version = "0.1.0"
description = "A production-style AI automation service for meetings and task workflows."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2.0",
    "asyncpg>=0.30,<1.0",
    "fastapi>=0.115,<1.0",
    "faster-whisper>=1.2,<2.0",
    "httpx>=0.27,<1.0",
    "openai>=2.0,<3.0",
    "pgvector>=0.5,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "sentence-transformers>=5.6,<6.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.21,<1.0",
    "pytest>=8.3,<10.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
